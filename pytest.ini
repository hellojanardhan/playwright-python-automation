[pytest]
testpaths = tests
python_files = test_*.py
addopts =
    --headed
    --browser=chromium
    --video=retain-on-failure
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --html=report.html
    --self-contained-html
    --capture=tee-sys
    --alluredir=reports/allure-results 
